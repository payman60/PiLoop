<meta name="theme-color" content="#54258b">
<title>PiLoop</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f8f6fc;color:#241936}
header{background:linear-gradient(120deg,#39205e,#7540a0);color:white;padding:22px}
nav{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font-size:27px;font-weight:bold;color:#f6c85c}
select,button,input{font:inherit;border-radius:10px;padding:12px}
select,input{border:1px solid #ddd;background:white}
.hero{text-align:center;padding:40px 18px}
.hero h1{color:#54258b;font-size:34px}
.hero p{line-height:1.9;color:#71647e}
.search{width:90%;max-width:500px;margin:15px}
.btn{background:#633493;color:white;border:0;cursor:pointer}
.grid{max-width:900px;margin:20px auto;padding:15px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:white;padding:20px;border-radius:16px;box-shadow:0 4px 18px #38205e12}
.card h3{color:#593080}
.card p{color:#756c80;font-size:14px;line-height:1.7}
.emoji{font-size:32px}
.action{margin:25px 15px;padding:25px;background:#eee5f7;border-radius:17px;text-align:center}
footer{text-align:center;padding:25px;color:#81758c}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>

</nav>
</header>

<section class="action">
<h2 id="requestTitle"></h2>

<button class="btn" onclick="comingSoon()">+ <span id="requestBtn"></span></button>

function changeLang(lang){
const t=translations[lang];
if(!t)return;

document.documentElement.lang=lang;
document.documentElement.dir=
["fa","ku","ar"].includes(lang)?"rtl":"ltr";

document.getElementById("title").textContent=t.title;
document.getElementById("subtitle").textContent=t.subtitle;
document.getElementById("search").placeholder=t.search;
document.getElementById("searchBtn").textContent=t.searchBtn;
document.getElementById("requestTitle").textContent=t.requestTitle;
document.getElementById("requestText").textContent=t.requestText;
document.getElementById("requestBtn").textContent=t.requestBtn;
document.getElementById("footer").textContent=t.footer;

t.cards.forEach((card,i)=>{
document.getElementById("card"+i+"title").textContent=card[0];
document.getElementById("card"+i+"text").textContent=card[1];
});
}

function searchItems(){
const q=document.getElementById("search").value.trim();
const t=translations[document.getElementById("language").value];
alert(q?"Search will be connected in a future version.":t.empty);
}

function comingSoon(){
const lang=document.getElementById("language").value;
alert(translations[lang].coming);
}


<script>
const categories={
 services:"خدمات",
 products:"محصولات",
 digital:"کار دیجیتال",
 community:"جامعه",
 opportunities:"فرصت‌های همکاری",
 learning:"آموزش و یادگیری",
 events:"رویدادها",
 help:"کمک‌رسانی"
};

let currentCategory="";
let currentView="all";

let items=JSON.parse(localStorage.getItem("piloop_items")||"[]");
let favorites=JSON.parse(localStorage.getItem("piloop_favorites")||"[]");

function save(){
 localStorage.setItem("piloop_items",JSON.stringify(items));
 localStorage.setItem("piloop_favorites",JSON.stringify(favorites));
}

function toast(message){
 const el=document.getElementById("toast");
 el.textContent=message;
 el.style.display="block";
 setTimeout(()=>el.style.display="none",2600);
}

function openModal(title,html){
 document.getElementById("modalTitle").textContent=title;
 document.getElementById("modalContent").innerHTML=html;
 document.getElementById("modal").style.display="block";
}

function closeModal(){
 document.getElementById("modal").style.display="none";
}

function openCategory(key){
 currentCategory=key;
 currentView="category";
 document.getElementById("listingTitle").textContent=categories[key];
 renderListings();
 document.getElementById("listingPanel").scrollIntoView({behavior:"smooth"});
}

function openAdd(){
 openModal("ثبت مورد جدید",`
 <form onsubmit="addListing(event)">
 <label>عنوان</label>
 <input class="field" id="itemTitle" required maxlength="90" placeholder="عنوان مورد را بنویسید">

 <label>دسته‌بندی</label>
 <select class="field" id="itemCategory">
 ${Object.entries(categories).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}
 </select>

 <label>توضیحات</label>
 <textarea class="field" id="itemDescription" required maxlength="1000" placeholder="توضیحات کامل را بنویسید"></textarea>

 <label>کشور یا شهر</label>
 <input class="field" id="itemLocation" maxlength="80" placeholder="مثلاً ایران، مهاباد">

 <label>راه ارتباطی</label>
 <input class="field" id="itemContact" maxlength="100" placeholder="راه ارتباطی دلخواه">

 <div class="form-buttons">
 <button class="primary" type="submit">ثبت مورد</button>
 <button class="secondary" type="button" onclick="closeModal()">انصراف</button>
 </div>
 </form>
 <p class="notice">اطلاعات این نسخه فعلاً فقط روی همین دستگاه ذخیره می‌شود.</p>
 `);
}

function addListing(event){
 event.preventDefault();

 const item={
 id:Date.now(),
 title:document.getElementById("itemTitle").value.trim(),
 category:document.getElementById("itemCategory").value,
 description:document.getElementById("itemDescription").value.trim(),
 location:document.getElementById("itemLocation").value.trim(),
 contact:document.getElementById("itemContact").value.trim(),
 date:new Date().toLocaleDateString("fa-IR")
 };

 if(!item.title||!item.description){
 toast("لطفاً اطلاعات ضروری را وارد کنید");
 return;
 }

 items.unshift(item);
 save();
 closeModal();
 currentView="all";
 currentCategory="";
 document.getElementById("listingTitle").textContent="آخرین موارد ثبت‌شده";
 renderListings();
 toast("مورد شما با موفقیت ثبت شد");
}

function renderListings(){
 const query=(document.getElementById("searchInput")?.value||"").trim().toLowerCase();

 let result=[...items];

 if(currentView==="category"){
 result=result.filter(x=>x.category===currentCategory);
 }

 if(currentView==="saved"){
 result=result.filter(x=>favorites.includes(x.id));
 }

 if(currentView==="my"){
 result=result.filter(x=>true);
 }

 if(query){
 result=result.filter(x=>
 (x.title+" "+x.description+" "+x.location+" "+(categories[x.category]||""))
 .toLowerCase().includes(query)
 );
 }

 const container=document.getElementById("listingResults");
 const count=document.getElementById("listingCount");

 if(!container)return;

 count.textContent=result.length+" مورد";

 if(result.length===0){
 container.innerHTML='<div class="empty">هنوز موردی برای نمایش وجود ندارد.</div>';
 return;
 }

 container.innerHTML=result.map(item=>`
 <div class="listing">
 <h4>${escapeHTML(item.title)}</h4>
 <p>${escapeHTML(item.description)}</p>
 <div class="meta">
 ${escapeHTML(categories[item.category]||"سایر")} 
 ${item.location?" | "+escapeHTML(item.location):""}
 | ${escapeHTML(item.date||"")}
 </div>
 <button onclick="toggleFavorite(${item.id})">
 ${favorites.includes(item.id)?"★ ذخیره‌شده":"☆ افزودن به علاقه‌مندی"}
 </button>
 <button onclick="showDetails(${item.id})">مشاهده جزئیات</button>
 <button onclick="deleteListing(${item.id})">حذف</button>
 </div>
 `).join("");
}

function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,function(ch){
 return {
 "&":"&amp;",
 "<":"&lt;",
 ">":"&gt;",
 '"':"&quot;",
 "'":"&#39;"
 }[ch];
 });
}

function toggleFavorite(id){
 if(favorites.includes(id)){
 favorites=favorites.filter(x=>x!==id);
 toast("از علاقه‌مندی‌ها حذف شد");
 }else{
 favorites.push(id);
 toast("به علاقه‌مندی‌ها اضافه شد");
 }
 save();
 renderListings();
}

function deleteListing(id){
 if(!confirm("آیا از حذف این مورد مطمئن هستید؟"))return;

 items=items.filter(x=>x.id!==id);
 favorites=favorites.filter(x=>x!==id);
 save();
 renderListings();
 toast("مورد حذف شد");
}

function showDetails(id){
 const item=items.find(x=>x.id===id);
 if(!item)return;

 openModal("جزئیات مورد",`
 <h3>${escapeHTML(item.title)}</h3>
 <p>${escapeHTML(item.description)}</p>
 <p>دسته‌بندی: ${escapeHTML(categories[item.category]||"")}</p>
 <p>مکان: ${escapeHTML(item.location||"ثبت نشده")}</p>
 <p>راه ارتباطی: ${escapeHTML(item.contact||"ثبت نشده")}</p>
 <p class="notice">پیش از هر همکاری، اطلاعات و هویت طرف مقابل را بررسی کنید.</p>
 <button class="primary" onclick="closeModal()">بستن</button>
 `);
}
</script>
